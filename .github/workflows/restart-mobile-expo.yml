name: Restart Amal mobile Expo

on:
  workflow_run:
    workflows:
      - Deploy to Amal server
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: amal-mobile-expo-restart
  cancel-in-progress: true

jobs:
  restart-mobile:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Prepare SSH key
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.AMAL_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.AMAL_SSH_PRIVATE_KEY_B64 }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"

          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::Missing GitHub secret AMAL_SSH_HOST"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"

          normalize_plain_key() {
            local target="$1"
            python3 -c 'import pathlib, sys; p=pathlib.Path(sys.argv[1]); text=p.read_text(); text=text.replace("\\\\r", "\r").replace("\\\\n", "\n"); text=text.replace("\r\n", "\n").replace("\r", "\n"); p.write_text(text if text.endswith("\n") else text + "\n")' "$target"
          }

          validate_key() {
            local target="$1"
            chmod 600 "$target"
            ssh-keygen -y -f "$target" >/dev/null 2>&1
          }

          KEY_OK=0
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
            normalize_plain_key "$KEY_FILE"
            if validate_key "$KEY_FILE"; then KEY_OK=1; fi
          fi

          if [ "$KEY_OK" != "1" ] && [ -n "${SSH_PRIVATE_KEY_B64:-}" ]; then
            if printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > "$KEY_FILE" 2>/tmp/amal_key_decode_error; then
              normalize_plain_key "$KEY_FILE"
              if validate_key "$KEY_FILE"; then KEY_OK=1; fi
            fi
          fi

          if [ "$KEY_OK" != "1" ]; then
            echo "::error::No usable SSH private key found."
            exit 1
          fi

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Detect SSH user and project path
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_USER: ${{ secrets.AMAL_SSH_USER }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
          PROJECT_PATH_SECRET: ${{ secrets.AMAL_PROJECT_PATH }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"

          PROJECT_PATH="${PROJECT_PATH_SECRET:-}"
          if [[ "${PROJECT_PATH:-}" == /mnt/* ]]; then
            CANDIDATES="root ${SSH_USER:-} pmsa"
          else
            CANDIDATES="${SSH_USER:-} pmsa root"
          fi

          DEPLOY_USER=""
          for candidate in $CANDIDATES; do
            [ -z "$candidate" ] && continue
            echo "Trying SSH user: $candidate"
            if ssh $SSH_OPTS "$candidate@$SSH_HOST" "echo connected" >/dev/null 2>&1; then
              DEPLOY_USER="$candidate"
              break
            fi
          done

          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::SSH authentication failed for candidate users."
            exit 1
          fi

          if [ -z "${PROJECT_PATH:-}" ]; then
            PROJECT_PATH=$(ssh $SSH_OPTS "$DEPLOY_USER@$SSH_HOST" 'set -e
              for path in \
                /mnt/home-storage/home/pmsa/apps/amal-school/amal-school-api \
                /home/pmsa/apps/amal-school/amal-school-api \
                /mnt/home-storage/home/pmsa/apps/amal-school-api \
                /home/pmsa/apps/amal-school-api
              do
                if [ -f "$path/artisan" ]; then
                  echo "$path"
                  exit 0
                fi
              done
              echo /mnt/home-storage/home/pmsa/apps/amal-school/amal-school-api
            ')
          fi

          echo "DEPLOY_USER=$DEPLOY_USER" >> "$GITHUB_ENV"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "Using SSH user: $DEPLOY_USER"
          echo "Project path: $PROJECT_PATH"

      - name: Patch settings touch handlers and restart Expo
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$SSH_HOST" "PROJECT_PATH='$PROJECT_PATH' DEPLOY_USER='$DEPLOY_USER' bash -s" <<'SH'
          set -euo pipefail

          APP_FILE="$PROJECT_PATH/mobile/App.js"
          if [ ! -f "$APP_FILE" ]; then
            if [ -f /home/pmsa/apps/amal-school/amal-school-api/mobile/App.js ]; then
              APP_FILE=/home/pmsa/apps/amal-school/amal-school-api/mobile/App.js
            else
              echo "::error::mobile/App.js was not found."
              exit 1
            fi
          fi

          python3 - "$APP_FILE" <<'PY'
import re
import sys
from pathlib import Path

p = Path(sys.argv[1])
text = p.read_text()

# Android/Expo sometimes treats taps inside ScrollView as scroll gestures unless taps are preserved.
text = text.replace(
    '<ScrollView contentContainerStyle={styles.screenPad} showsVerticalScrollIndicator={false}>',
    '<ScrollView contentContainerStyle={styles.screenPad} showsVerticalScrollIndicator={false} keyboardShouldPersistTaps="handled">'
)

# Make every settings row have a clear press target and keep non-clickable rows visually inert.
new_action_row = '''function ActionRow({ icon, title, subtitle, accent = C.primary, onPress, noBorder }) {
  const touchProps = onPress
    ? { onPress, activeOpacity: 0.76, hitSlop: { top: 8, bottom: 8, left: 8, right: 8 } }
    : { disabled: true, activeOpacity: 1 };
  return (
    <TouchableOpacity {...touchProps} delayPressIn={0} style={[styles.actionRow, noBorder && { borderBottomWidth: 0 }]}>
      <Ionicons name="chevron-back" size={16} color={onPress ? C.border : 'transparent'} />
      <View style={styles.actionRowText} pointerEvents="none">
        <Text style={styles.actionRowTitle}>{title}</Text>
        {subtitle ? <Text style={styles.actionRowSub}>{subtitle}</Text> : null}
      </View>
      <View pointerEvents="none" style={[styles.actionRowIcon, { backgroundColor: `${accent}18` }]}><Ionicons name={icon} size={20} color={accent} /></View>
    </TouchableOpacity>
  );
}'''
text = re.sub(r'function ActionRow\(\{ icon, title, subtitle, accent = C\.primary, onPress, noBorder \}\) \{.*?\n\}\n\nfunction HomeScreen', new_action_row + '\n\nfunction HomeScreen', text, flags=re.S, count=1)

# If an older deployed copy still contains the reports block, remove it because those rows had no actions.
text = re.sub(r'\n\s*<Text style=\{styles\.settingsSectionLabel\}>التقارير</Text>\s*<View style=\{styles\.listCard\}>\s*<ActionRow icon="stats-chart-outline" title="إحصائيات الرفع" subtitle="نسبة اكتمال ملفات كل معلمة" accent=\{C\.teal\} />\s*<ActionRow icon="ribbon-outline" title="المعايير المكتملة" subtitle="المعايير التي اكتملت ملفاتها" accent=\{C\.green\} noBorder />\s*</View>', '', text, count=1)

# Add feedback for rows that are informational only, so the screen never feels dead.
text = text.replace(
    '<ActionRow icon="help-circle-outline" title="الدعم والمساعدة" subtitle="تواصلي مع فريق الدعم" accent={C.muted} />',
    '<ActionRow icon="help-circle-outline" title="الدعم والمساعدة" subtitle="تواصلي مع فريق الدعم" accent={C.muted} onPress={() => Alert.alert(\'الدعم والمساعدة\', \'سيتم ربط وسيلة الدعم لاحقاً.\')} />'
)
text = text.replace(
    '<ActionRow icon="person-outline" title="بياناتي الشخصية" subtitle="الاسم واسم المستخدم" accent={C.primary} />',
    '<ActionRow icon="person-outline" title="بياناتي الشخصية" subtitle="الاسم واسم المستخدم" accent={C.primary} onPress={() => Alert.alert(\'بياناتي الشخصية\', user?.name || \'لا توجد بيانات\')} />'
)
text = text.replace(
    '<ActionRow icon="folder-outline" title="ملفاتي المرفوعة" subtitle="جميع الملفات التي رفعتِها" accent={C.teal} noBorder />',
    '<ActionRow icon="folder-outline" title="ملفاتي المرفوعة" subtitle="جميع الملفات التي رفعتِها" accent={C.teal} onPress={() => Alert.alert(\'ملفاتي المرفوعة\', \'افتحي تبويب المعايير لاستعراض الملفات.\')} noBorder />'
)

p.write_text(text)
PY

          run_as_pmsa() {
            if [ "${DEPLOY_USER:-}" = "root" ]; then
              su -s /bin/bash pmsa -c "$1"
            else
              bash -lc "$1"
            fi
          }

          MOBILE_PATH="$PROJECT_PATH/mobile"
          if [ ! -d "$MOBILE_PATH" ] && [ -d /home/pmsa/apps/amal-school/amal-school-api/mobile ]; then
            MOBILE_PATH=/home/pmsa/apps/amal-school/amal-school-api/mobile
          fi

          run_as_pmsa "pkill -f 'expo.*8081|metro.*8081|node.*8081|@expo/cli.*8081' || true"
          if command -v lsof >/dev/null 2>&1; then
            run_as_pmsa "lsof -ti:8081 | xargs -r kill -9 || true"
          fi

          run_as_pmsa "cd '$MOBILE_PATH' && mkdir -p /home/pmsa/apps/.cache /home/pmsa/apps/.tmp && nohup env BROWSER=none EXPO_NO_TELEMETRY=1 REACT_NATIVE_PACKAGER_HOSTNAME=amal.pm.sa XDG_CACHE_HOME=/home/pmsa/apps/.cache TMPDIR=/home/pmsa/apps/.tmp TMP=/home/pmsa/apps/.tmp TEMP=/home/pmsa/apps/.tmp npx expo start --clear --go --host lan --port 8081 > /home/pmsa/apps/amal-school-expo.log 2>&1 < /dev/null &"

          sleep 8
          run_as_pmsa "tail -n 60 /home/pmsa/apps/amal-school-expo.log || true"
          SH
