name: Restart Amal mobile Expo

on:
  workflow_run:
    workflows:
      - Deploy to Amal server
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: amal-mobile-expo-restart
  cancel-in-progress: true

jobs:
  restart-mobile:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Prepare SSH key
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.AMAL_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.AMAL_SSH_PRIVATE_KEY_B64 }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"

          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::Missing GitHub secret AMAL_SSH_HOST"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"

          normalize_plain_key() {
            local target="$1"
            python3 -c 'import pathlib, sys; p=pathlib.Path(sys.argv[1]); text=p.read_text(); text=text.replace("\\\\r", "\r").replace("\\\\n", "\n"); text=text.replace("\r\n", "\n").replace("\r", "\n"); p.write_text(text if text.endswith("\n") else text + "\n")' "$target"
          }

          validate_key() {
            local target="$1"
            chmod 600 "$target"
            ssh-keygen -y -f "$target" >/dev/null 2>&1
          }

          KEY_OK=0
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
            normalize_plain_key "$KEY_FILE"
            if validate_key "$KEY_FILE"; then KEY_OK=1; fi
          fi

          if [ "$KEY_OK" != "1" ] && [ -n "${SSH_PRIVATE_KEY_B64:-}" ]; then
            if printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > "$KEY_FILE" 2>/tmp/amal_key_decode_error; then
              normalize_plain_key "$KEY_FILE"
              if validate_key "$KEY_FILE"; then KEY_OK=1; fi
            fi
          fi

          if [ "$KEY_OK" != "1" ]; then
            echo "::error::No usable SSH private key found."
            exit 1
          fi

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Detect SSH user and project path
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_USER: ${{ secrets.AMAL_SSH_USER }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
          PROJECT_PATH_SECRET: ${{ secrets.AMAL_PROJECT_PATH }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"

          PROJECT_PATH="${PROJECT_PATH_SECRET:-}"
          if [[ "${PROJECT_PATH:-}" == /mnt/* ]]; then
            CANDIDATES="root ${SSH_USER:-} pmsa"
          else
            CANDIDATES="${SSH_USER:-} pmsa root"
          fi

          DEPLOY_USER=""
          for candidate in $CANDIDATES; do
            [ -z "$candidate" ] && continue
            echo "Trying SSH user: $candidate"
            if ssh $SSH_OPTS "$candidate@$SSH_HOST" "echo connected" >/dev/null 2>&1; then
              DEPLOY_USER="$candidate"
              break
            fi
          done

          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::SSH authentication failed for candidate users."
            exit 1
          fi

          if [ -z "${PROJECT_PATH:-}" ]; then
            PROJECT_PATH=$(ssh $SSH_OPTS "$DEPLOY_USER@$SSH_HOST" 'set -e
              for path in \
                /mnt/home-storage/home/pmsa/apps/amal-school/amal-school-api \
                /home/pmsa/apps/amal-school/amal-school-api \
                /mnt/home-storage/home/pmsa/apps/amal-school-api \
                /home/pmsa/apps/amal-school-api
              do
                if [ -f "$path/artisan" ]; then
                  echo "$path"
                  exit 0
                fi
              done
              echo /mnt/home-storage/home/pmsa/apps/amal-school/amal-school-api
            ')
          fi

          echo "DEPLOY_USER=$DEPLOY_USER" >> "$GITHUB_ENV"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "Using SSH user: $DEPLOY_USER"
          echo "Project path: $PROJECT_PATH"

      - name: Patch mobile tabs and restart Expo
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$SSH_HOST" "PROJECT_PATH='$PROJECT_PATH' DEPLOY_USER='$DEPLOY_USER' bash -s" <<'SH'
          set -euo pipefail

          APP_FILE="$PROJECT_PATH/mobile/App.js"
          if [ ! -f "$APP_FILE" ] && [ -f /home/pmsa/apps/amal-school/amal-school-api/mobile/App.js ]; then
            APP_FILE=/home/pmsa/apps/amal-school/amal-school-api/mobile/App.js
          fi
          if [ ! -f "$APP_FILE" ]; then
            echo "::error::mobile/App.js was not found."
            exit 1
          fi

          python3 - "$APP_FILE" <<'PY'
import re
import sys
from pathlib import Path

p = Path(sys.argv[1])
text = p.read_text()

# Names requested for mobile.
text = text.replace('title="معايير التقييم" subtitle={isPrincipal ? \'عرض ملفات المعلمات\' : \'عرض ورفع الملفات\'}', 'title="حسب المعايير" subtitle={isPrincipal ? \'عرض الملفات حسب كل معيار\' : \'عرض ورفع الملفات\'}')
text = text.replace('<Text style={styles.pageTitle}>معايير التقييم</Text>', '<Text style={styles.pageTitle}>حسب المعايير</Text>')
text = text.replace('<AdminBackHeader title="متابعة ملفات المعلمات" onBack={onBack} />', '<AdminBackHeader title="متابعة المعلمات" onBack={onBack} />')

# Remove teacher follow-up from Settings; it will be a main tab.
text = text.replace(
    '<ActionRow icon="people-outline" title="المعلمات" subtitle="إضافة وتعديل وحذف حسابات المعلمات" accent={C.primary} onPress={onOpenTeachers} /><ActionRow icon="folder-open-outline" title="متابعة ملفات المعلمات" subtitle="استعراض ملفات كل معلمة حسب المعيار" accent={C.gold} onPress={onOpenTeacherFiles} noBorder />',
    '<ActionRow icon="people-outline" title="المعلمات" subtitle="إضافة وتعديل وحذف حسابات المعلمات" accent={C.primary} onPress={onOpenTeachers} noBorder />'
)
text = text.replace(
    'function SettingsScreen({ user, onLogout, onOpenTeachers, onOpenTeacherFiles })',
    'function SettingsScreen({ user, onLogout, onOpenTeachers })'
)
text = text.replace(
    '<SettingsScreen user={user} onLogout={onLogout} onOpenTeachers={() => setSettingsSub(\'teachers\')} onOpenTeacherFiles={() => setSettingsSub(\'teacherFiles\')} />',
    '<SettingsScreen user={user} onLogout={onLogout} onOpenTeachers={() => setSettingsSub(\'teachers\')} />'
)

# Main bottom tabs: principal gets teacher follow-up as a real tab.
new_bottom = '''function BottomNav({ tab, setTab, isPrincipal }) {
  const tabs = [
    { id: 'home', icon: 'home', iconOff: 'home-outline', label: 'الرئيسية' },
    { id: 'evidence', icon: 'list', iconOff: 'list-outline', label: 'حسب المعايير' },
    ...(isPrincipal ? [{ id: 'teacherFiles', icon: 'folder-open', iconOff: 'folder-open-outline', label: 'متابعة المعلمات' }] : []),
    { id: 'settings', icon: 'settings', iconOff: 'settings-outline', label: 'الإعدادات' },
  ];
  return <View style={styles.bottomNavWrap}><View style={styles.bottomNav}>{tabs.map((t) => { const active = tab === t.id; return <TouchableOpacity key={t.id} style={[styles.navTab, active && styles.navTabActive]} onPress={() => setTab(t.id)} activeOpacity={0.8}><Ionicons name={active ? t.icon : t.iconOff} size={21} color={active ? C.primary : C.muted} /><Text style={[styles.navLabel, active && styles.navLabelActive]} numberOfLines={1}>{t.label}</Text></TouchableOpacity>; })}</View></View>;
}'''
text = re.sub(
    r'function BottomNav\(\{ tab, setTab, isPrincipal \}\) \{.*?\n\}\n\nfunction MainApp',
    new_bottom + '\n\nfunction MainApp',
    text,
    flags=re.S,
    count=1,
)

# Add principal quick action on Home.
text = re.sub(
    r'(<ActionRow icon="checkmark-done-circle-outline" title="حسب المعايير" subtitle=\{isPrincipal \? \'عرض الملفات حسب كل معيار\' : \'عرض ورفع الملفات\'\} accent=\{C\.teal\} onPress=\{\(\) => setTab\(\'evidence\'\)\} />)\n\s*\{isPrincipal && <ActionRow icon="settings-outline" title="الإعدادات" subtitle="إدارة المدرسة" accent=\{C\.gold\} onPress=\{\(\) => setTab\(\'settings\'\)\} noBorder />\}',
    r'\1\n        {isPrincipal && <ActionRow icon="folder-open-outline" title="متابعة المعلمات" subtitle="اختيار معلمة ثم معيار لعرض ملفاتها" accent={C.gold} onPress={() => setTab(\'teacherFiles\')} />}\n        <ActionRow icon="settings-outline" title="الإعدادات" subtitle="خيارات الحساب وإدارة المدرسة" accent={C.primary} onPress={() => setTab(\'settings\')} noBorder />',
    text,
    count=1,
)

# Route the teacher follow-up tab to the existing screen.
if "tab === 'teacherFiles'" not in text:
    text = text.replace(
        "else if (tab === 'settings' && settingsSub === 'teachers') screen = <TeachersManagementScreen token={token} onBack={() => setSettingsSub(null)} />;",
        "else if (tab === 'teacherFiles') screen = <TeacherFilesScreen token={token} onBack={() => goTab('home')} onOpenEvidence={(item) => setSelectedEvidence(item)} />;\n  else if (tab === 'settings' && settingsSub === 'teachers') screen = <TeachersManagementScreen token={token} onBack={() => setSettingsSub(null)} />;",
        1,
    )
text = text.replace(
    "else if (tab === 'settings' && settingsSub === 'teacherFiles') screen = <TeacherFilesScreen token={token} onBack={() => setSettingsSub(null)} onOpenEvidence={(item) => setSelectedEvidence(item)} />;\n  ",
    "",
)

# Make labels readable with four tabs.
text = text.replace('fontSize: 11, fontWeight: \'800\'', 'fontSize: 10.5, fontWeight: \'800\'')

p.write_text(text)
PY

          run_as_pmsa() {
            if [ "${DEPLOY_USER:-}" = "root" ]; then
              su -s /bin/bash pmsa -c "$1"
            else
              bash -lc "$1"
            fi
          }

          MOBILE_PATH="$PROJECT_PATH/mobile"
          if [ ! -d "$MOBILE_PATH" ] && [ -d /home/pmsa/apps/amal-school/amal-school-api/mobile ]; then
            MOBILE_PATH=/home/pmsa/apps/amal-school/amal-school-api/mobile
          fi

          run_as_pmsa "pkill -f 'expo.*8081|metro.*8081|node.*8081|@expo/cli.*8081' || true"
          if command -v lsof >/dev/null 2>&1; then
            run_as_pmsa "lsof -ti:8081 | xargs -r kill -9 || true"
          fi

          run_as_pmsa "cd '$MOBILE_PATH' && mkdir -p /home/pmsa/apps/.cache /home/pmsa/apps/.tmp && nohup env BROWSER=none EXPO_NO_TELEMETRY=1 REACT_NATIVE_PACKAGER_HOSTNAME=amal.pm.sa XDG_CACHE_HOME=/home/pmsa/apps/.cache TMPDIR=/home/pmsa/apps/.tmp TMP=/home/pmsa/apps/.tmp TEMP=/home/pmsa/apps/.tmp npx expo start --clear --go --host lan --port 8081 > /home/pmsa/apps/amal-school-expo.log 2>&1 < /dev/null &"

          sleep 8
          run_as_pmsa "tail -n 80 /home/pmsa/apps/amal-school-expo.log || true"
          SH
