name: Android React Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - mobile/**
      - scripts/patch_mobile_settings_managers.py
      - .github/workflows/android.yml
  pull_request:
    branches:
      - main
    paths:
      - mobile/**
      - scripts/patch_mobile_settings_managers.py
      - .github/workflows/android.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Expo app dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Apply latest mobile managers redesign before APK build
        run: |
          set -euo pipefail
          python3 scripts/patch_mobile_settings_managers.py
          grep -n "إدارة المعلمات\|إضافة معلمة\|إدارة المعايير\|managerTeacherRow\|settingsSub === 'teachers'\|settingsSub === 'criteria'" mobile/App.js | head -80
      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Prepare Android Gradle properties
        working-directory: mobile
        run: |
          node -e "const fs=require('fs');const p='android/gradle.properties';if(fs.existsSync(p)){const s=fs.readFileSync(p,'utf8').split(/\r?\n/).filter(l=>!l.startsWith('android.disableAutomaticComponentCreation')).join('\n');fs.writeFileSync(p,s+'\n');}"
      - name: Build bundled release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: amal-react-native-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
