name: Android React Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Expo app dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: amal-react-native-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
