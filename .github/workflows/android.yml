name: Android React Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - mobile/**
      - scripts/patch_app_mobile_fixed_settings.py
      - scripts/patch_app_mobile_fixed_v107.py
      - .github/workflows/android.yml
  pull_request:
    branches:
      - main
    paths:
      - mobile/**
      - scripts/patch_app_mobile_fixed_settings.py
      - scripts/patch_app_mobile_fixed_v107.py
      - .github/workflows/android.yml

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Expo app dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Apply settings patches to real mobile entry
        run: |
          set -euo pipefail
          python3 scripts/patch_app_mobile_fixed_settings.py
          python3 scripts/patch_app_mobile_fixed_v107.py
          grep -n "إدارة المعلمات" mobile/AppMobileFixed.js
          grep -n "إدارة المعايير" mobile/AppMobileFixed.js
          grep -n "1.0.7" mobile/AppMobileFixed.js
          grep -n "person-add-outline" mobile/AppMobileFixed.js
          grep -n "trash-outline" mobile/AppMobileFixed.js
          grep -n "create-outline" mobile/AppMobileFixed.js
          grep -n "CriteriaManagementScreen" mobile/AppMobileFixed.js
          ! grep -n "title=\"متابعة ملفات المعلمات\"" mobile/AppMobileFixed.js
      - name: Generate app icons
        working-directory: mobile
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          assets = Path('assets')
          assets.mkdir(exist_ok=True)
          s = 1024
          img = Image.new('RGBA', (s, s), (67,97,238,255))
          d = ImageDraw.Draw(img)
          for y in range(s):
              t = y / (s - 1)
              d.line([(0,y),(s,y)], fill=(int(67*(1-t)+26*t), int(97*(1-t)+16*t), int(238*(1-t)+96*t), 255))
          d.rounded_rectangle((96,96,928,928), radius=210, fill=(255,255,255,28))
          d.rounded_rectangle((225,325,799,755), radius=76, fill=(255,255,255,238))
          d.polygon([(310,390),(512,250),(714,390)], fill=(255,255,255,248))
          d.line([(310,390),(512,250),(714,390)], fill=(67,97,238,255), width=26)
          d.rounded_rectangle((340,435,684,690), radius=34, fill=(238,241,255,255))
          for x in (378, 484, 590):
              d.rounded_rectangle((x,485,x+54,558), radius=16, fill=(67,97,238,230))
          d.rounded_rectangle((468,585,556,690), radius=22, fill=(26,16,96,235))
          d.ellipse((648,612,848,812), fill=(245,158,11,255), outline=(255,255,255,255), width=20)
          d.line([(696,713),(742,754),(804,675)], fill=(255,255,255,255), width=26)
          for name, n in [('icon.png',1024),('adaptive-icon.png',1024),('splash-icon.png',512),('favicon.png',48)]:
              img.resize((n,n), Image.LANCZOS).save(assets/name)
          PY
          node - <<'NODE'
          const fs = require('fs');
          const p = 'app.json';
          const j = JSON.parse(fs.readFileSync(p,'utf8'));
          j.expo.icon = './assets/icon.png';
          j.expo.android = j.expo.android || {};
          j.expo.android.adaptiveIcon = {
            foregroundImage: './assets/adaptive-icon.png',
            backgroundColor: '#4361EE'
          };
          j.expo.splash = { image: './assets/splash-icon.png', resizeMode: 'contain', backgroundColor: '#EEF4FF' };
          fs.writeFileSync(p, JSON.stringify(j,null,2));
          NODE
      - name: Set Android build version
        working-directory: mobile
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'app.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.expo.android = j.expo.android || {};
          j.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
          fs.writeFileSync(p, JSON.stringify(j, null, 2));
          NODE
      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Prepare Android Gradle properties
        working-directory: mobile
        run: |
          node -e "const fs=require('fs');const p='android/gradle.properties';if(fs.existsSync(p)){const s=fs.readFileSync(p,'utf8').split(/\r?\n/).filter(l=>!l.startsWith('android.disableAutomaticComponentCreation')).join('\n');fs.writeFileSync(p,s+'\n');}"
      - name: Verify real entry before APK bundle
        working-directory: mobile
        run: |
          set -euo pipefail
          grep -n "AppMobileFixed" index.js
          grep -n "إدارة المعلمات" AppMobileFixed.js
          grep -n "إدارة المعايير" AppMobileFixed.js
          grep -n "1.0.7" AppMobileFixed.js
          grep -n "person-add-outline" AppMobileFixed.js
          grep -n "trash-outline" AppMobileFixed.js
          grep -n "create-outline" AppMobileFixed.js
          test -f assets/icon.png
          test -f assets/adaptive-icon.png
      - name: Build bundled release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Prepare SSH key for APK publishing
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.AMAL_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.AMAL_SSH_PRIVATE_KEY_B64 }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          mkdir -p "$HOME/.ssh"
          normalize_key() {
            python3 -c 'import pathlib, sys; p=pathlib.Path(sys.argv[1]); text=p.read_text(); text=text.replace("\\r", "\r").replace("\\n", "\n"); text=text.replace("\r\n", "\n").replace("\r", "\n"); p.write_text(text if text.endswith("\n") else text + "\n")' "$1"
          }
          KEY_OK=0
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
            normalize_key "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1 && KEY_OK=1 || true
          fi
          if [ "$KEY_OK" != "1" ] && [ -n "${SSH_PRIVATE_KEY_B64:-}" ]; then
            printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > "$KEY_FILE"
            normalize_key "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1 && KEY_OK=1 || true
          fi
          if [ "$KEY_OK" != "1" ]; then
            echo "::error::No usable SSH private key found."
            exit 1
          fi
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Publish latest APK and update manifest
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_USER: ${{ secrets.AMAL_SSH_USER }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
          PROJECT_PATH_SECRET: ${{ secrets.AMAL_PROJECT_PATH }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"
          PROJECT_PATH="${PROJECT_PATH_SECRET:-}"
          DEPLOY_USER=""
          CANDIDATES="${SSH_USER:-} pmsa root"
          for candidate in $CANDIDATES; do
            [ -z "$candidate" ] && continue
            if ssh $SSH_OPTS "$candidate@$SSH_HOST" "echo connected" >/dev/null 2>&1; then
              DEPLOY_USER="$candidate"
              break
            fi
          done
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::SSH authentication failed."
            exit 1
          fi
          if [ -z "$PROJECT_PATH" ]; then
            PROJECT_PATH="/mnt/home-storage/home/pmsa/apps/amal-school/amal-school-api"
          fi

          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          VERSION_NAME=$(node -p "require('./mobile/app.json').expo.version")
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          mkdir -p /tmp/amal-update
          cp "$APK_PATH" /tmp/amal-update/amal-latest.apk
          cat > /tmp/amal-update/android.json <<EOF
          {
            "version_name": "$VERSION_NAME",
            "version_code": $VERSION_CODE,
            "apk_url": "https://amal.pm.sa/updates/amal-latest.apk",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          ssh $SSH_OPTS "$DEPLOY_USER@$SSH_HOST" "mkdir -p '$PROJECT_PATH/public/updates'"
          scp -P "$SSH_PORT" -i "$KEY_FILE" -o IdentitiesOnly=yes             /tmp/amal-update/amal-latest.apk             /tmp/amal-update/android.json             "$DEPLOY_USER@$SSH_HOST:$PROJECT_PATH/public/updates/"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amal-school-auto-update-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
