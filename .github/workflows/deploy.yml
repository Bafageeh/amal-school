name: Deploy to Amal server

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: amal-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend assets
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare SSH key
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.AMAL_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.AMAL_SSH_PRIVATE_KEY_B64 }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"

          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::Missing GitHub secret AMAL_SSH_HOST"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"

          normalize_plain_key() {
            local target="$1"
            python3 -c 'import pathlib, sys; p=pathlib.Path(sys.argv[1]); text=p.read_text(); text=text.replace("\\\\r", "\r").replace("\\\\n", "\n"); text=text.replace("\r\n", "\n").replace("\r", "\n"); p.write_text(text if text.endswith("\n") else text + "\n")' "$target"
          }

          validate_key() {
            local target="$1"
            chmod 600 "$target"
            ssh-keygen -y -f "$target" >/dev/null 2>&1
          }

          KEY_OK=0

          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
            normalize_plain_key "$KEY_FILE"
            if validate_key "$KEY_FILE"; then
              KEY_OK=1
            else
              echo "::warning::AMAL_SSH_PRIVATE_KEY is not a usable private key. Trying AMAL_SSH_PRIVATE_KEY_B64 if available."
            fi
          fi

          if [ "$KEY_OK" != "1" ] && [ -n "${SSH_PRIVATE_KEY_B64:-}" ]; then
            if printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > "$KEY_FILE" 2>/tmp/amal_key_decode_error; then
              normalize_plain_key "$KEY_FILE"
              if validate_key "$KEY_FILE"; then
                KEY_OK=1
              else
                echo "::warning::AMAL_SSH_PRIVATE_KEY_B64 decoded but is not a usable private key."
              fi
            else
              echo "::warning::AMAL_SSH_PRIVATE_KEY_B64 is not valid base64."
            fi
          fi

          if [ "$KEY_OK" != "1" ]; then
            echo "::error::No usable SSH private key found. Store the full private key in AMAL_SSH_PRIVATE_KEY, or store base64 -w0 of the private key in AMAL_SSH_PRIVATE_KEY_B64. Do not use the public key here."
            exit 1
          fi

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Detect server user and project path
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_USER: ${{ secrets.AMAL_SSH_USER }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
          PROJECT_PATH_SECRET: ${{ secrets.AMAL_PROJECT_PATH }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"

          if [ -n "${PROJECT_PATH_SECRET:-}" ]; then
            PROJECT_PATH="$PROJECT_PATH_SECRET"
          else
            PROJECT_PATH=""
          fi

          # /mnt/home-storage/... is the real WHM/root path. Prefer root for it because pmsa cannot create /mnt.
          if [[ "${PROJECT_PATH:-}" == /mnt/* ]]; then
            CANDIDATES="root ${SSH_USER:-} pmsa"
          else
            CANDIDATES="${SSH_USER:-} pmsa root"
          fi

          DEPLOY_USER=""
          for candidate in $CANDIDATES; do
            if [ -z "$candidate" ]; then
              continue
            fi

            echo "Trying SSH user: $candidate"
            if ssh $SSH_OPTS "$candidate@$SSH_HOST" "echo connected" >/dev/null 2>&1; then
              DEPLOY_USER="$candidate"
              break
            fi
          done

          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::SSH authentication failed for candidate users. If AMAL_PROJECT_PATH starts with /mnt, authorize the SSH key for root or set AMAL_SSH_USER=root."
            exit 1
          fi

          echo "DEPLOY_USER=$DEPLOY_USER" >> "$GITHUB_ENV"
          echo "Using SSH user: $DEPLOY_USER"

          if [ -z "${PROJECT_PATH:-}" ]; then
            PROJECT_PATH=$(ssh $SSH_OPTS "$DEPLOY_USER@$SSH_HOST" 'set -e
              for path in \
                /mnt/home-storage/home/pmsa/apps/amal-school-api \
                /home/pmsa/apps/amal-school-api \
                /mnt/home-storage/home/pmsa/apps/amal-school/amal-school-api \
                /home/pmsa/apps/amal-school/amal-school-api \
                /var/www/amal-school-api \
                /var/www/amal-school \
                /var/www/html
              do
                if [ -f "$path/artisan" ]; then
                  echo "$path"
                  exit 0
                fi
              done
              echo /mnt/home-storage/home/pmsa/apps/amal-school-api
            ')
          fi

          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::Could not resolve project path. Add GitHub secret AMAL_PROJECT_PATH."
            exit 1
          fi

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "Deploying to: $PROJECT_PATH"

      - name: Upload files to server
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$SSH_HOST" "mkdir -p '$PROJECT_PATH'"
          rsync -az \
            --delete \
            --exclude='.git/' \
            --exclude='.github/deploy-trigger.txt' \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/*.php' \
            -e "ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$SSH_HOST:$PROJECT_PATH/"

      - name: Run Laravel production commands
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$SSH_HOST" "set -e
            cd '$PROJECT_PATH'
            pwd
            php -v
            if [ ! -f .env ]; then
              echo '::error::.env is missing on the server project path.'
              exit 1
            fi
            if [ ! -f vendor/autoload.php ]; then
              if command -v composer >/dev/null 2>&1; then
                composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
              else
                echo '::error::vendor/autoload.php is missing and composer is not available on the server.'
                exit 1
              fi
            fi
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            php artisan migrate --force
            php artisan db:seed --class=TeacherAccountsSeeder --force || true
            CACHE_STORE=file php artisan optimize:clear
            CACHE_STORE=file php artisan config:cache
            CACHE_STORE=file php artisan view:cache
          "
