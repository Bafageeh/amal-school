name: Deploy to server

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AMAL_SSH_HOST }}
          username: ${{ secrets.AMAL_SSH_USER }}
          key: ${{ secrets.AMAL_SSH_PRIVATE_KEY }}
          port: ${{ secrets.AMAL_SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.AMAL_PROJECT_PATH }}"
            git pull origin main
            php artisan optimize:clear
