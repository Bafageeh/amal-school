name: Deploy to server

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.AMAL_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.AMAL_SSH_PRIVATE_KEY_B64 }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -e
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"

          if [ -z "$SSH_HOST" ]; then
            echo "::error::Missing GitHub secret AMAL_SSH_HOST"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"

          normalize_plain_key() {
            local target="$1"
            python3 - "$target" <<'PY'
import pathlib
import sys

path = pathlib.Path(sys.argv[1])
text = path.read_text()
text = text.replace('\\r', '\r').replace('\\n', '\n')
text = text.replace('\r\n', '\n').replace('\r', '\n')
if not text.endswith('\n'):
    text += '\n'
path.write_text(text)
PY
          }

          validate_key() {
            local target="$1"
            chmod 600 "$target"
            ssh-keygen -y -f "$target" >/dev/null 2>&1
          }

          KEY_OK=0

          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
            normalize_plain_key "$KEY_FILE"
            if validate_key "$KEY_FILE"; then
              KEY_OK=1
            else
              echo "::warning::AMAL_SSH_PRIVATE_KEY is not a usable private key. Trying AMAL_SSH_PRIVATE_KEY_B64 if available."
            fi
          fi

          if [ "$KEY_OK" != "1" ] && [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            if printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > "$KEY_FILE" 2>/tmp/amal_key_decode_error; then
              normalize_plain_key "$KEY_FILE"
              if validate_key "$KEY_FILE"; then
                KEY_OK=1
              else
                echo "::warning::AMAL_SSH_PRIVATE_KEY_B64 decoded but is not a usable private key."
              fi
            else
              echo "::warning::AMAL_SSH_PRIVATE_KEY_B64 is not valid base64."
            fi
          fi

          if [ "$KEY_OK" != "1" ]; then
            echo "::error::No usable SSH private key found. Store the full private key in AMAL_SSH_PRIVATE_KEY, or store base64 -w0 of the private key in AMAL_SSH_PRIVATE_KEY_B64. Do not use the public key here."
            exit 1
          fi

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload files to server
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_USER: ${{ secrets.AMAL_SSH_USER }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
          PROJECT_PATH: /mnt/home-storage/home/pmsa/apps/amal-school/amal-school-api
        run: |
          set -e
          SSH_PORT="${SSH_PORT:-22}"
          SSH_USER="${SSH_USER:-pmsa}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -i $KEY_FILE -p $SSH_PORT"

          if [ -z "$SSH_HOST" ]; then
            echo "::error::Missing GitHub secret AMAL_SSH_HOST"
            exit 1
          fi

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$PROJECT_PATH'"
          rsync -az \
            --delete \
            --exclude='.git/' \
            --exclude='.github/deploy-trigger.txt' \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/*.php' \
            -e "ssh $SSH_OPTS" \
            ./ "$SSH_USER@$SSH_HOST:$PROJECT_PATH/"

      - name: Run Laravel commands
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_USER: ${{ secrets.AMAL_SSH_USER }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
          PROJECT_PATH: /mnt/home-storage/home/pmsa/apps/amal-school/amal-school-api
        run: |
          set -e
          SSH_PORT="${SSH_PORT:-22}"
          SSH_USER="${SSH_USER:-pmsa}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -i $KEY_FILE -p $SSH_PORT"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "set -e; cd '$PROJECT_PATH'; pwd; php -v; mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache; composer install --no-dev --optimize-autoloader --no-interaction; php artisan migrate --force; php artisan db:seed --class=TeacherAccountsSeeder --force; CACHE_STORE=file php -d display_errors=1 artisan optimize:clear"
