name: Deploy Amal to independent PSM

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: amal-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check assessment configuration and scoring
        run: |
          php -l config/teacher_assessment.php
          php -l app/Http/Controllers/TeacherAssessmentController.php
          php tests/Manual/teacher_assessment_smoke.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend assets
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare SSH key
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.AMAL_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.AMAL_SSH_PRIVATE_KEY_B64 }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-2222}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::Missing GitHub secret AMAL_SSH_HOST"
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          normalize_key() {
            python3 -c 'import pathlib, sys; p=pathlib.Path(sys.argv[1]); text=p.read_text(); text=text.replace("\\\\r", "\r").replace("\\\\n", "\n"); text=text.replace("\r\n", "\n").replace("\r", "\n"); p.write_text(text if text.endswith("\n") else text + "\n")' "$1"
          }
          KEY_OK=0
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
            normalize_key "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1 && KEY_OK=1 || true
          fi
          if [ "$KEY_OK" != "1" ] && [ -n "${SSH_PRIVATE_KEY_B64:-}" ]; then
            printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > "$KEY_FILE"
            normalize_key "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1 && KEY_OK=1 || true
          fi
          if [ "$KEY_OK" != "1" ]; then
            echo "::error::No usable SSH private key found."
            exit 1
          fi
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Verify independent PSM destination
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-2222}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"
          DEPLOY_USER=root
          PROJECT_PATH=/mnt/HC_Volume_107348367/psm/pm/amal/deployment-source
          ssh $SSH_OPTS "$DEPLOY_USER@$SSH_HOST" "/usr/local/sbin/psm-amal-deploy status"
          echo "DEPLOY_USER=$DEPLOY_USER" >> "$GITHUB_ENV"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

      - name: Upload release to PSM staging
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-2222}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='mobile/node_modules/' \
            --exclude='mobile/.expo/' \
            --exclude='storage/' \
            --exclude='public/updates/' \
            --exclude='bootstrap/cache/*.php' \
            -e "ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$SSH_HOST:$PROJECT_PATH/"

      - name: Activate with independent PSM PHP and services
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-2222}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$KEY_FILE" -p "$SSH_PORT" \
            "$DEPLOY_USER@$SSH_HOST" "/usr/local/sbin/psm-amal-deploy activate"
