name: Apply Amal mobile server patch

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch_mobile_settings_managers.py'
      - '.github/workflows/mobile-tabs-direct.yml'
  workflow_dispatch:

concurrency:
  group: amal-mobile-server-patch
  cancel-in-progress: true

jobs:
  patch-and-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.AMAL_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.AMAL_SSH_PRIVATE_KEY_B64 }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          mkdir -p "$HOME/.ssh"
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
            python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); s=p.read_text(); s=s.replace("\\\\n","\n").replace("\r\n","\n").replace("\r","\n"); p.write_text(s if s.endswith("\n") else s+"\n")' "$KEY_FILE"
          else
            printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          ssh-keygen -y -f "$KEY_FILE" >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Apply patch and restart Expo 8090
        env:
          SSH_HOST: ${{ secrets.AMAL_SSH_HOST }}
          SSH_USER: ${{ secrets.AMAL_SSH_USER }}
          SSH_PORT: ${{ secrets.AMAL_SSH_PORT }}
          PROJECT_PATH: ${{ secrets.AMAL_PROJECT_PATH }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          REQUESTED_USER="${SSH_USER:-pmsa}"
          PROJECT_PATH="${PROJECT_PATH:-/mnt/home-storage/home/pmsa/apps/amal-school/amal-school-api}"
          KEY_FILE="$HOME/.ssh/amal_github_actions"
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i $KEY_FILE -p $SSH_PORT"
          SSH_USER=""
          for candidate in root "$REQUESTED_USER" pmsa; do
            [ -z "$candidate" ] && continue
            if ssh $SSH_OPTS "$candidate@$SSH_HOST" "echo ok" >/dev/null 2>&1; then
              SSH_USER="$candidate"
              break
            fi
          done
          [ -n "$SSH_USER" ] || { echo "::error::SSH authentication failed"; exit 1; }
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i "$KEY_FILE" -P "$SSH_PORT" scripts/patch_mobile_settings_managers.py "$SSH_USER@$SSH_HOST:/tmp/patch_mobile_settings_managers.py"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "PROJECT_PATH='$PROJECT_PATH' SSH_USER='$SSH_USER' bash -s" <<'SH'
          set -euo pipefail
          cd "$PROJECT_PATH"
          python3 /tmp/patch_mobile_settings_managers.py
          grep -n "إضافة معلمة\|إدارة المعايير\|CriteriaManagementScreen\|settingsSub === 'criteria'\|trash-outline\|pencil-outline\|save-outline" mobile/App.js | head -80
          pkill -f 'expo.*8090|metro.*8090|node.*8090|@expo/cli.*8090' || true
          if command -v lsof >/dev/null 2>&1; then
            for pid in $(lsof -ti:8090 2>/dev/null || true); do
              kill -9 "$pid" 2>/dev/null || true
            done
          fi
          rm -rf /home/pmsa/apps/.tmp/metro-cache
          mkdir -p /home/pmsa/apps/.cache /home/pmsa/apps/.tmp
          chown -R pmsa:pmsa /home/pmsa/apps/.cache /home/pmsa/apps/.tmp || true
          chmod -R u+rwX /home/pmsa/apps/.cache /home/pmsa/apps/.tmp || true
          su -s /bin/bash pmsa -c "cd /home/pmsa/apps/amal-school/amal-school-api/mobile && nohup env BROWSER=none EXPO_NO_TELEMETRY=1 REACT_NATIVE_PACKAGER_HOSTNAME=amal.pm.sa XDG_CACHE_HOME=/home/pmsa/apps/.cache TMPDIR=/home/pmsa/apps/.tmp TMP=/home/pmsa/apps/.tmp TEMP=/home/pmsa/apps/.tmp npx expo start --clear --go --host lan --port 8090 > /home/pmsa/apps/amal-school-expo.log 2>&1 < /dev/null &"
          sleep 10
          tail -n 80 /home/pmsa/apps/amal-school-expo.log
          SH
